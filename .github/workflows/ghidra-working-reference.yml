name: w0uFF - Private reference DLL Ghidra trace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ghidra-working-reference.yml'
      - 'd3d12.dll'
      - 'scripts/trace_reference_player.py'

permissions:
  contents: read

jobs:
  analyze-working-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout only analysis scripts
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify committed working reference DLL SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s d3d12.dll
          mkdir -p "$RUNNER_TEMP/reference-input"
          printf '%s  %s\n' 'b9055133ce5c28397e3fcd285cc4ba30268da0bfc0c1e82d5555ecf0aff0ac4f' d3d12.dll | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          data=Path('d3d12.dll').read_bytes()
          if len(data) != 15788032 or not data.startswith(b'MZ'):
              raise SystemExit('Wrong reference DLL identity/size')
          print('Reference matches previously verified working 2026-11-09 binary')
          PY
          cp d3d12.dll "$RUNNER_TEMP/reference-input/d3d12.dll"

      - name: Install verified Ghidra 11.4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.3_build/ghidra_11.4.3_PUBLIC_20251203.zip' \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo 'b22a8baebb14339f19903c54363ba7e01781930cc43ab430539aabce0d58547a  '"$RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          GHIDRA_ROOT="$RUNNER_TEMP/ghidra_11.4.3_PUBLIC"
          test -f "$GHIDRA_ROOT/support/analyzeHeadless"
          echo "GHIDRA_ROOT=$GHIDRA_ROOT" >> "$GITHUB_ENV"

      - name: Analyze exact reference (no binary or pseudocode upload)
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/ghidra-project"
          if ! "$GHIDRA_ROOT/support/analyzeHeadless" \
            "$RUNNER_TEMP/ghidra-project" w0uff-reference \
            -import "$RUNNER_TEMP/reference-input/d3d12.dll" \
            -scriptPath "$PWD/scripts" \
            -postScript trace_reference_player.py "$PWD/reports/reference-callgraph.txt" \
            -analysisTimeoutPerFile 900 \
            -max-cpu 2 \
            -deleteProject \
            > "$RUNNER_TEMP/ghidra-reference-console.log" 2>&1; then
            echo "::error::Ghidra failed; last 70 console lines (technical only)"
            tail -n 70 "$RUNNER_TEMP/ghidra-reference-console.log"
            exit 1
          fi
          test -s reports/reference-callgraph.txt
          grep -q 'REFERENCE_TRACE_DONE' reports/reference-callgraph.txt
          grep -E 'Executable:|Image base:|Functions discovered:|UI_SITE|DECOMPILATION_COMPLETED|REFERENCE_TRACE_DONE' \
            reports/reference-callgraph.txt | head -35
          echo '=== Bounded reference trace (no third-party pseudocode) ==='
          sed -n '1,160p' reports/reference-callgraph.txt
          echo 'Only an address/call-graph report will be published.'

      - name: Publish metadata-only Ghidra findings
        uses: actions/upload-artifact@v4
        with:
          name: w0uFF-reference-Fly-PlayerResolver-callgraph
          path: reports/reference-callgraph.txt
          if-no-files-found: error

      - name: Destroy downloaded reference from runner workspace
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/reference-input" "$RUNNER_TEMP/reference-download" "$RUNNER_TEMP/ghidra-project"
