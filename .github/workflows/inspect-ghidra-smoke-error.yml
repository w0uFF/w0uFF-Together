name: Inspect earlier Ghidra script error
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-ghidra-smoke-error.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: w0uFF-Ghidra-11.4.3-smoke-report
          run-id: 45068507451
          github-token: ${{ github.token }}
          path: report
      - name: Report script traceback or preliminary file
        shell: bash
        run: |
          set -euo pipefail
          find report -maxdepth 2 -type f -printf '%p\n'
          if [ -f report/reference-trace-api-smoke.txt ]; then
            echo '=== Earlier trace API smoke diagnostic ==='
            sed -n '1,160p' report/reference-trace-api-smoke.txt
          fi
