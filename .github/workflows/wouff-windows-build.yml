name: w0uFF Together - Windows DLL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wouff-windows-build.yml'
      - 'wouff-source.zip'
      - 'wouff-vendor-1.zip'
      - 'wouff-vendor-2.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    name: Portable C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o wouff-source.zip
          unzip -q -o wouff-vendor-1.zip
          unzip -q -o wouff-vendor-2.zip
          test -f w0uFF-Together/CMakeLists.txt
      - name: Configure tests
        run: cmake -S w0uFF-Together -B build-tests -DWOUFF_TESTS_ONLY=ON
      - name: Compile tests
        run: cmake --build build-tests --parallel 2
      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build:
    name: Compile Windows x64
    needs: unit_tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Expand source and vendored dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($part in @('wouff-source.zip', 'wouff-vendor-1.zip', 'wouff-vendor-2.zip')) {
            if (!(Test-Path $part)) { throw "Missing archive: $part" }
            Expand-Archive -Path $part -DestinationPath '.' -Force
          }
          if (!(Test-Path 'w0uFF-Together/CMakeLists.txt')) { throw 'Missing project source' }
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Validate pinned local dependencies
        shell: pwsh
        run: cmake -S w0uFF-Together -B check-deps -DWOUFF_VALIDATE_DEPS_ONLY=ON -DWOUFF_USE_VENDORED_DEPS=ON
      - name: Configure CMake
        shell: pwsh
        run: cmake -S w0uFF-Together -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFINAL=YES -DWOUFF_USE_VENDORED_DEPS=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON -DLUA_USE_LUAJIT=OFF
      - name: Compile DLL
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --target UnchainedTogether
      - name: Validate and stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'build/d3d12_.dll'
          if (!(Test-Path $dll)) { throw 'DLL missing after build' }
          $pe = [IO.File]::ReadAllBytes($dll)
          if ($pe.Length -lt 1024 -or $pe[0] -ne 77 -or $pe[1] -ne 90) { throw 'Missing MZ header' }
          $offset = [BitConverter]::ToInt32($pe, 0x3C)
          if ($offset -lt 64 -or ($offset + 6) -gt $pe.Length) { throw 'Bad PE header offset' }
          if ([Text.Encoding]::ASCII.GetString($pe, $offset, 4) -ne "PE`0`0") { throw 'Missing PE header' }
          if ([BitConverter]::ToUInt16($pe, $offset + 4) -ne 0x8664) { throw 'Not an x64 PE' }
          $exports = (& dumpbin /exports $dll | Out-String)
          if ($LASTEXITCODE -ne 0 -or $exports -notmatch 'D3D12CreateDevice') { throw 'DX12 proxy export missing' }
          New-Item -Type Directory -Path dist -Force | Out-Null
          Copy-Item $dll dist/d3d12.dll
          Get-FileHash dist/d3d12.dll -Algorithm SHA256 | Format-List
          Write-Host 'Unverified DLL compiled. In-game validation still required.'
      - name: Publish DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: w0uFF-Together-Windows-DLL-unverified
          path: dist/d3d12.dll
          if-no-files-found: error
